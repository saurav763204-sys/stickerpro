<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StickerPro Studio</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f6f7fb;
  --panel:#fff;
  --line:#e7e8ee;
  --text:#171923;
  --muted:#747887;
  --accent:#6c4cff;
  --accent-light:#eeeaff;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{font:inherit}

button{cursor:pointer}

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:900;
  font-size:20px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(135deg,#6c4cff,#9b82ff);
  color:white;
  display:grid;
  place-items:center;
}

.brand span{color:var(--accent)}

.top-actions{
  display:flex;
  gap:8px;
}

.top-btn{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 13px;
  border-radius:9px;
}

.export{
  border:0;
  background:var(--accent);
  color:white;
  padding:10px 17px;
  border-radius:9px;
  font-weight:800;
}

.layout{
  display:grid;
  grid-template-columns:72px 270px 1fr 285px;
  height:calc(100vh - 64px);
}

.tools{
  background:#fff;
  border-right:1px solid var(--line);
  padding:12px 7px;
}

.tool{
  width:100%;
  border:0;
  background:transparent;
  padding:11px 4px;
  border-radius:10px;
  color:var(--muted);
  margin-bottom:5px;
  font-size:11px;
}

.tool span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.tool:hover,
.tool.active{
  color:var(--accent);
  background:var(--accent-light);
}

.panel{
  background:#fff;
  border-right:1px solid var(--line);
  padding:18px;
  overflow:auto;
}

.panel.right{
  border-right:0;
  border-left:1px solid var(--line);
}

.panel h3{
  margin:0 0 18px;
  font-size:16px;
}

.section{
  padding-bottom:18px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}

.label{
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
  color:#555967;
}

.control{
  width:100%;
  border:1px solid #dddfe7;
  background:#fff;
  border-radius:9px;
  padding:10px;
  outline:none;
}

.control:focus{
  border-color:var(--accent);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tool-action{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  padding:11px;
  border-radius:9px;
  margin-bottom:8px;
  text-align:left;
}

.tool-action:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.danger{
  color:#e84b62;
}

.workspace{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 35%,#fff 0,#f2f2f6 40%,#e8e9ee 100%);
}

.workspace-head{
  height:48px;
  border-bottom:1px solid var(--line);
  background:#fff9;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  color:var(--muted);
  font-size:12px;
}

.canvas-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  padding:30px;
}

.canvas-wrap{
  position:relative;
  width:650px;
  max-width:80%;
  box-shadow:0 15px 45px #0002;
  border-radius:12px;
}

canvas{
  width:100%;
  height:auto;
  display:block;
  background:#fff;
  border-radius:12px;
}

.statusbar{
  height:44px;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  color:var(--muted);
  font-size:12px;
}

.layers{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.layer{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  cursor:pointer;
}

.layer.selected{
  border-color:var(--accent);
  background:var(--accent-light);
}

.layer-icon{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  background:#f0f0f4;
  border-radius:7px;
}

.layer-name{
  flex:1;
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.layer-mini{
  border:0;
  background:transparent;
  color:#888;
  padding:3px;
}

.empty{
  color:#888;
  text-align:center;
}

.mobile-tools{
  display:none;
}

input[type="color"]{
  padding:3px;
  height:42px;
}

input[type="range"]{
  padding:0;
  accent-color:var(--accent);
}

@media(max-width:1100px){

  .layout{
    grid-template-columns:70px 250px 1fr;
  }

  .right{
    display:none;
  }
}

@media(max-width:700px){

  .topbar{
    height:58px;
  }

  .top-actions .top-btn{
    display:none;
  }

  .layout{
    display:block;
    height:calc(100vh - 58px);
  }

  .tools,
  .panel{
    display:none;
  }

  .workspace{
    height:100%;
  }

  .canvas-area{
    padding:15px;
    padding-bottom:75px;
  }

  .canvas-wrap{
    max-width:96%;
  }

  .mobile-tools{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:64px;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
  }

  .mobile-tools button{
    border:0;
    background:none;
    color:#666;
    font-size:11px;
  }

  .mobile-tools span{
    display:block;
    font-size:20px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="logo">✦</div>
    Sticker<span>Pro</span>
  </div>

  <div class="top-actions">
    <button class="top-btn" onclick="undo()">↶ Undo</button>
    <button class="top-btn" onclick="redo()">↷ Redo</button>
    <button class="top-btn" onclick="newProject()">＋ New</button>
    <button class="export" onclick="exportPNG()">Export PNG</button>
  </div>

</header>


<div class="layout">

  <!-- TOOLBAR -->

  <aside class="tools">

    <button class="tool active">
      <span>▣</span>
      Design
    </button>

    <button class="tool" onclick="uploadImage()">
      <span>＋</span>
      Upload
    </button>

    <button class="tool" onclick="addText()">
      <span>T</span>
      Text
    </button>

    <button class="tool" onclick="addEmoji()">
      <span>☺</span>
      Emoji
    </button>

    <button class="tool" onclick="addShape()">
      <span>◇</span>
      Shape
    </button>

  </aside>


  <!-- LEFT PANEL -->

  <aside class="panel">

    <h3>Sticker Studio</h3>

    <div class="section">

      <button class="tool-action primary" onclick="uploadImage()">
        ＋ Upload Image
      </button>

      <button class="tool-action" onclick="addText()">
        T Add Text
      </button>

      <button class="tool-action" onclick="addEmoji()">
        ☺ Add Emoji
      </button>

      <button class="tool-action" onclick="addShape()">
        ◇ Add Shape
      </button>

      <input
        id="file"
        type="file"
        accept="image/*"
        hidden
      >

    </div>


    <div class="section">

      <div class="label">LAYERS</div>

      <div id="layers" class="layers">
        <div class="empty">
          Add an element to start
        </div>
      </div>

    </div>


    <div class="section">

      <div class="label">LAYER ACTIONS</div>

      <button class="tool-action" onclick="moveUp()">
        ↑ Bring Forward
      </button>

      <button class="tool-action" onclick="moveDown()">
        ↓ Send Backward
      </button>

      <button class="tool-action" onclick="duplicateSelected()">
        ⧉ Duplicate
      </button>

      <button class="tool-action danger" onclick="deleteSelected()">
        × Delete
      </button>

    </div>

  </aside>


  <!-- CANVAS -->

  <main class="workspace">

    <div class="workspace-head">
      <span>Untitled Sticker</span>
      <span>1000 × 1000 px</span>
    </div>

    <div class="canvas-area">

      <div class="canvas-wrap">
        <canvas id="canvas" width="1000" height="1000"></canvas>
      </div>

    </div>

    <div class="statusbar">
      <span id="selectedStatus">No layer selected</span>
      <span>•</span>
      <span>PNG Export</span>
    </div>

  </main>


  <!-- RIGHT PANEL -->

  <aside class="panel right">

    <h3>Properties</h3>

    <div id="properties">

      <div class="empty">
        Select a layer to edit its properties.
      </div>

    </div>

  </aside>

</div>


<div class="mobile-tools">

  <button onclick="uploadImage()">
    <span>＋</span>
    Upload
  </button>

  <button onclick="addText()">
    <span>T</span>
    Text
  </button>

  <button onclick="addEmoji()">
    <span>☺</span>
    Emoji
  </button>

  <button onclick="addShape()">
    <span>◇</span>
    Shape
  </button>

  <button onclick="exportPNG()">
    <span>↓</span>
    Export
  </button>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let layers=[];
let selectedId=null;

let history=[];
let future=[];

let idCounter=1;


function uid(){
  return idCounter++;
}


function saveHistory(){

  history.push(
    JSON.stringify(layers)
  );

  if(history.length>30)
    history.shift();

  future=[];
}


function undo(){

  if(!history.length)return;

  future.push(
    JSON.stringify(layers)
  );

  layers=JSON.parse(
    history.pop()
  );

  selectedId=null;

  render();
}


function redo(){

  if(!future.length)return;

  history.push(
    JSON.stringify(layers)
  );

  layers=JSON.parse(
    future.pop()
  );

  render();
}


function uploadImage(){

  document.getElementById("file").click();
}


document
.getElementById("file")
.addEventListener("change",function(e){

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(event){

    const img=new Image();

    img.onload=function(){

      saveHistory();

      const layer={
        id:uid(),
        type:"image",
        name:"Image",
        img:img.src,
        x:500,
        y:430,
        width:500,
        height:500,
        rotation:0,
        opacity:1,
        visible:true,
        locked:false
      };

      layers.push(layer);
      selectedId=layer.id;

      render();

    };

    img.src=event.target.result;

  };

  reader.readAsDataURL(file);

});


function addText(){

  saveHistory();

  const layer={
    id:uid(),
    type:"text",
    name:"Text",
    text:"Your Text",
    x:500,
    y:750,
    size:70,
    font:"Arial",
    color:"#6c4cff",
    outline:"#ffffff",
    outlineWidth:5,
    rotation:0,
    opacity:1,
    visible:true,
    locked:false
  };

  layers.push(layer);
  selectedId=layer.id;

  render();
}


function addEmoji(){

  saveHistory();

  const layer={
    id:uid(),
    type:"emoji",
    name:"Emoji",
    emoji:"🔥",
    x:800,
    y:180,
    size:100,
    rotation:0,
    visible:true,
    locked:false
  };

  layers.push(layer);
  selectedId=layer.id;

  render();
}


function addShape(){

  saveHistory();

  const layer={
    id:uid(),
    type:"shape",
    name:"Shape",
    shape:"circle",
    x:500,
    y:500,
    width:500,
    height:500,
    color:"#ffffff",
    stroke:"#171923",
    strokeWidth:10,
    rotation:0,
    opacity:1,
    visible:true,
    locked:false
  };

  layers.push(layer);
  selectedId=layer.id;

  render();
}


function render(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  layers.forEach(layer=>{

    if(!layer.visible)return;

    drawLayer(layer);

  });

  renderLayers();
  renderProperties();

  const selected=getSelected();

  document.getElementById("selectedStatus").textContent=
    selected
    ? selected.name
    : "No layer selected";
}


function drawLayer(layer){

  ctx.save();

  ctx.globalAlpha=
    layer.opacity ?? 1;

  if(layer.type==="image")
    drawImage(layer);

  if(layer.type==="text")
    drawText(layer);

  if(layer.type==="emoji")
    drawEmoji(layer);

  if(layer.type==="shape")
    drawShape(layer);

  ctx.restore();
}


function drawImage(layer){

  const img=new Image();

  img.onload=function(){

    ctx.save();

    ctx.translate(
      layer.x,
      layer.y
    );

    ctx.rotate(
      layer.rotation*Math.PI/180
    );

    ctx.drawImage(
      img,
      -layer.width/2,
      -layer.height/2,
      layer.width,
      layer.height
    );

    ctx.restore();

  };

  img.src=layer.img;
}


function drawText(layer){

  ctx.save();

  ctx.translate(
    layer.x,
    layer.y
  );

  ctx.rotate(
    layer.rotation*Math.PI/180
  );

  ctx.font=
    `900 ${layer.size}px "${layer.font}"`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.lineWidth=
    layer.outlineWidth*2;

  ctx.strokeStyle=
    layer.outline;

  ctx.strokeText(
    layer.text,
    0,
    0
  );

  ctx.fillStyle=
    layer.color;

  ctx.fillText(
    layer.text,
    0,
    0
  );

  ctx.restore();
}


function drawEmoji(layer){

  ctx.save();

  ctx.translate(
    layer.x,
    layer.y
  );

  ctx.rotate(
    layer.rotation*Math.PI/180
  );

  ctx.font=
    `${layer.size}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    layer.emoji,
    0,
    0
  );

  ctx.restore();
}


function drawShape(layer){

  ctx.save();

  ctx.translate(
    layer.x,
    layer.y
  );

  ctx.rotate(
    layer.rotation*Math.PI/180
  );

  ctx.fillStyle=
    layer.color;

  ctx.strokeStyle=
    layer.stroke;

  ctx.lineWidth=
    layer.strokeWidth;

  if(layer.shape==="circle"){

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      layer.width/2,
      layer.height/2,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

  }else{

    ctx.beginPath();

    ctx.rect(
      -layer.width/2,
      -layer.height/2,
      layer.width,
      layer.height
    );

    ctx.fill();
    ctx.stroke();

  }

  ctx.restore();
}


function renderLayers(){

  const container=
    document.getElementById("layers");

  if(!layers.length){

    container.innerHTML=
      '<div class="empty">Add an element to start</div>';

    return;
  }

  container.innerHTML="";

  [...layers]
    .reverse()
    .forEach(layer=>{

      const row=
        document.createElement("div");

      row.className=
        "layer"+
        (layer.id===selectedId
          ?" selected"
          :"");

      const icon=
        layer.type==="image"
        ?"🖼️"
        :layer.type==="text"
        ?"T"
        :layer.type==="emoji"
        ?"☺"
        :"◇";

      row.innerHTML=`
        <div class="layer-icon">${icon}</div>
        <div class="layer-name">${layer.name}</div>
        <button class="layer-mini"
          onclick="event.stopPropagation();toggleVisibility(${layer.id})">
          ${layer.visible?"◉":"○"}
        </button>
        <button class="layer-mini"
          onclick="event.stopPropagation();toggleLock(${layer.id})">
          ${layer.locked?"🔒":"🔓"}
        </button>
      `;

      row.onclick=()=>{
        selectedId=layer.id;
        render();
      };

      container.appendChild(row);

    });

}


function renderProperties(){

  const panel=
    document.getElementById("properties");

  const layer=getSelected();

  if(!layer){

    panel.innerHTML=
      '<div class="empty">Select a layer to edit its properties.</div>';

    return;
  }

  if(layer.type==="text"){

    panel.innerHTML=`

      <div class="section">

        <div class="label">TEXT</div>

        <input
          id="propText"
          class="control"
          value="${escapeHTML(layer.text)}"
        >

        <br><br>

        <select id="propFont" class="control">
          <option ${layer.font==="Arial"?"selected":""}>Arial</option>
          <option ${layer.font==="Impact"?"selected":""}>Impact</option>
          <option ${layer.font==="Georgia"?"selected":""}>Georgia</option>
          <option ${layer.font==="Trebuchet MS"?"selected":""}>Trebuchet MS</option>
          <option ${layer.font==="Courier New"?"selected":""}>Courier New</option>
        </select>

      </div>

      <div class="section">

        <div class="label">COLOR</div>

        <div class="row">

          <input
            id="propColor"
            class="control"
            type="color"
            value="${layer.color}"
          >

          <input
            id="propOutline"
            class="control"
            type="color"
            value="${layer.outline}"
          >

        </div>

      </div>

      <div class="section">

        <div class="label">
          SIZE
          <span>${layer.size}px</span>
        </div>

        <input
          id="propSize"
          class="control"
          type="range"
          min="20"
          max="180"
          value="${layer.size}"
        >

      </div>

      <div class="section">

        <div class="label">POSITION X</div>

        <input
          id="propX"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.x}"
        >

        <br><br>

        <div class="label">POSITION Y</div>

        <input
          id="propY"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.y}"
        >

        <br><br>

        <div class="label">ROTATION</div>

        <input
          id="propRotation"
          class="control"
          type="range"
          min="-180"
          max="180"
          value="${layer.rotation}"
        >

      </div>
    `;

    bindTextProperties(layer);

  }

  else if(layer.type==="emoji"){

    panel.innerHTML=`

      <div class="section">

        <div class="label">EMOJI</div>

        <input
          id="propEmoji"
          class="control"
          value="${escapeHTML(layer.emoji)}"
        >

      </div>

      <div class="section">

        <div class="label">SIZE</div>

        <input
          id="propSize"
          class="control"
          type="range"
          min="20"
          max="200"
          value="${layer.size}"
        >

      </div>

      <div class="section">

        <div class="label">POSITION X</div>

        <input
          id="propX"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.x}"
        >

        <br><br>

        <div class="label">POSITION Y</div>

        <input
          id="propY"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.y}"
        >

        <br><br>

        <div class="label">ROTATION</div>

        <input
          id="propRotation"
          class="control"
          type="range"
          min="-180"
          max="180"
          value="${layer.rotation}"
        >

      </div>
    `;

    bindCommonProperties(layer);

  }

  else if(layer.type==="shape"){

    panel.innerHTML=`

      <div class="section">

        <div class="label">SHAPE</div>

        <select id="propShape" class="control">

          <option value="circle"
            ${layer.shape==="circle"?"selected":""}>
            Circle
          </option>

          <option value="square"
            ${layer.shape==="square"?"selected":""}>
            Square
          </option>

        </select>

      </div>

      <div class="section">

        <div class="label">FILL / STROKE</div>

        <div class="row">

          <input
            id="propColor"
            class="control"
            type="color"
            value="${layer.color}"
          >

          <input
            id="propStroke"
            class="control"
            type="color"
            value="${layer.stroke}"
          >

        </div>

      </div>

      <div class="section">

        <div class="label">SIZE</div>

        <input
          id="propWidth"
          class="control"
          type="range"
          min="50"
          max="900"
          value="${layer.width}"
        >

        <br><br>

        <input
          id="propHeight"
          class="control"
          type="range"
          min="50"
          max="900"
          value="${layer.height}"
        >

      </div>

      <div class="section">

        <div class="label">POSITION X</div>

        <input
          id="propX"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.x}"
        >

        <br><br>

        <div class="label">POSITION Y</div>

        <input
          id="propY"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.y}"
        >

      </div>
    `;

    bindShapeProperties(layer);

  }

  else if(layer.type==="image"){

    panel.innerHTML=`

      <div class="section">

        <div class="label">IMAGE SIZE</div>

        <input
          id="propWidth"
          class="control"
          type="range"
          min="50"
          max="1000"
          value="${layer.width}"
        >

        <br><br>

        <input
          id="propHeight"
          class="control"
          type="range"
          min="50"
          max="1000"
          value="${layer.height}"
        >

      </div>

      <div class="section">

        <div class="label">POSITION X</div>

        <input
          id="propX"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.x}"
        >

        <br><br>

        <div class="label">POSITION Y</div>

        <input
          id="propY"
          class="control"
          type="range"
          min="0"
          max="1000"
          value="${layer.y}"
        >

        <br><br>

        <div class="label">ROTATION</div>

        <input
          id="propRotation"
          class="control"
          type="range"
          min="-180"
          max="180"
          value="${layer.rotation}"
        >

      </div>
    `;

    bindCommonProperties(layer);
    bindImageProperties(layer);

  }

}


function bindTextProperties(layer){

  $("propText").oninput=e=>{
    layer.text=e.target.value;
    renderCanvasOnly();
  };

  $("propFont").onchange=e=>{
    layer.font=e.target.value;
    renderCanvasOnly();
  };

  $("propColor").oninput=e=>{
    layer.color=e.target.value;
    renderCanvasOnly();
  };

  $("propOutline").oninput=e=>{
    layer.outline=e.target.value;
    renderCanvasOnly();
  };

  $("propSize").oninput=e=>{
    layer.size=Number(e.target.value);
    renderCanvasOnly();
    renderProperties();
  };

  $("propX").oninput=e=>{
    layer.x=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propY").oninput=e=>{
    layer.y=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propRotation").oninput=e=>{
    layer.rotation=Number(e.target.value);
    renderCanvasOnly();
  };

}


function bindCommonProperties(layer){

  $("propX").oninput=e=>{
    layer.x=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propY").oninput=e=>{
    layer.y=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propRotation").oninput=e=>{
    layer.rotation=Number(e.target.value);
    renderCanvasOnly();
  };

  if($("propSize")){

    $("propSize").oninput=e=>{
      layer.size=Number(e.target.value);
      renderCanvasOnly();
    };

  }

  if($("propEmoji")){

    $("propEmoji").oninput=e=>{
      layer.emoji=e.target.value;
      renderCanvasOnly();
    };

  }

}


function bindImageProperties(layer){

  $("propWidth").oninput=e=>{
    layer.width=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propHeight").oninput=e=>{
    layer.height=Number(e.target.value);
    renderCanvasOnly();
  };

}


function bindShapeProperties(layer){

  $("propShape").onchange=e=>{
    layer.shape=e.target.value;
    renderCanvasOnly();
  };

  $("propColor").oninput=e=>{
    layer.color=e.target.value;
    renderCanvasOnly();
  };

  $("propStroke").oninput=e=>{
    layer.stroke=e.target.value;
    renderCanvasOnly();
  };

  $("propWidth").oninput=e=>{
    layer.width=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propHeight").oninput=e=>{
    layer.height=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propX").oninput=e=>{
    layer.x=Number(e.target.value);
    renderCanvasOnly();
  };

  $("propY").oninput=e=>{
    layer.y=Number(e.target.value);
    renderCanvasOnly();
  };

}


function renderCanvasOnly(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  layers.forEach(layer=>{

    if(layer.visible)
      drawLayer(layer);

  });
}


function getSelected(){

  return layers.find(
    l=>l.id===selectedId
  );

}


function toggleVisibility(id){

  const layer=
    layers.find(l=>l.id===id);

  if(!layer)return;

  layer.visible=!layer.visible;

  render();

}


function toggleLock(id){

  const layer=
    layers.find(l=>l.id===id);

  if(!layer)return;

  layer.locked=!layer.locked;

  render();

}


function deleteSelected(){

  if(selectedId===null)return;

  saveHistory();

  layers=
    layers.filter(
      l=>l.id!==selectedId
    );

  selectedId=null;

  render();

}


function duplicateSelected(){

  const layer=getSelected();

  if(!layer)return;

  saveHistory();

  const copy=
    JSON.parse(
      JSON.stringify(layer)
    );

  copy.id=uid();
  copy.name=layer.name+" Copy";
  copy.x+=30;
  copy.y+=30;

  layers.push(copy);

  selectedId=copy.id;

  render();

}


function moveUp(){

  const index=
    layers.findIndex(
      l=>l.id===selectedId
    );

  if(index<0||index===layers.length-1)
    return;

  saveHistory();

  [
    layers[index],
    layers[index+1]
  ]=[
    layers[index+1],
    layers[index]
  ];

  render();

}


function moveDown(){

  const index=
    layers.findIndex(
      l=>l.id===selectedId
    );

  if(index<=0)return;

  saveHistory();

  [
    layers[index],
    layers[index-1]
  ]=[
    layers[index-1],
    layers[index]
  ];

  render();

}


function newProject(){

  if(!layers.length)return;

  if(!confirm("Start a new sticker?"))
    return;

  saveHistory();

  layers=[];
  selectedId=null;

  render();

}


function exportPNG(){

  renderCanvasOnly();

  const link=
    document.createElement("a");

  link.download=
    "stickerpro-design.png";

  link.href=
    canvas.toDataURL(
      "image/png",
      1
    );

  link.click();

}


function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function $(id){
  return document.getElementById(id);
}


render();

</script>

</body>
</html>
