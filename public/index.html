<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickerPro - Sticker Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:#f7f7fb;
  color:#151728;
}

nav{
  height:72px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  border-bottom:1px solid #eee;
}

.logo{
  font-size:28px;
  font-weight:800;
}

.logo span{
  color:#6d5dfc;
}

nav a{
  text-decoration:none;
  color:#151728;
  margin-left:20px;
  font-size:17px;
}

.hero{
  text-align:center;
  padding:55px 20px 35px;
}

.hero h1{
  font-size:48px;
  margin:0 0 15px;
}

.hero h1 span{
  color:#6d5dfc;
}

.hero p{
  font-size:20px;
  color:#666;
}

.creator{
  max-width:650px;
  margin:20px auto 70px;
  background:white;
  padding:30px;
  border-radius:28px;
  box-shadow:0 10px 35px #00000012;
}

.creator h2{
  text-align:center;
  font-size:32px;
  margin-top:0;
}

input[type="text"],
input[type="file"]{
  width:100%;
  padding:16px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:17px;
  margin-top:12px;
  border-radius:15px;
  background:#6d5dfc;
  color:white;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:#5948ee;
}

#canvas{
  display:block;
  width:100%;
  max-width:500px;
  margin:25px auto;
  border-radius:25px;
  background:white;
  border:8px solid white;
  box-shadow:0 5px 20px #0002;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  nav{
    padding:0 18px;
  }

  .hero h1{
    font-size:38px;
  }

  .creator{
    margin:15px;
    padding:22px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">✨ Sticker<span>Pro</span></div>

  <div>
    <a href="#creator">Create</a>
    <a href="#store">Store</a>
  </div>
</nav>

<section class="hero">
  <h1>Create. Sell. <span>Scale.</span></h1>
  <p>Create beautiful custom stickers and download them instantly.</p>
</section>

<section class="creator" id="creator">

  <h2>🎨 Sticker Creator</h2>

  <input
    type="text"
    id="stickerText"
    placeholder="Enter your sticker text"
    value="StickerPro"
  >

  <input
    type="file"
    id="imageInput"
    accept="image/*"
  >

  <button onclick="createSticker()">
    ✨ Create Sticker
  </button>

  <canvas id="canvas" width="800" height="800"></canvas>

  <button onclick="downloadSticker()">
    ⬇️ Download Sticker
  </button>

</section>

<section id="store" class="hero">
  <h2>🛍️ Sticker Store</h2>
  <p>More sticker packs coming soon.</p>
</section>

<footer>
  © 2026 StickerPro
</footer>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let uploadedImage = null;

function drawSticker(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // white background
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // rounded sticker border
  ctx.strokeStyle = "#151728";
  ctx.lineWidth = 25;

  roundRect(ctx,25,25,750,750,55);
  ctx.stroke();

  // uploaded image
  if(uploadedImage){

    const size = 420;
    const x = (800-size)/2;
    const y = 100;

    ctx.drawImage(
      uploadedImage,
      x,
      y,
      size,
      size
    );
  }

  // text
  const text =
    document.getElementById("stickerText").value ||
    "StickerPro";

  ctx.font = "bold 60px system-ui";
  ctx.textAlign = "center";
  ctx.fillStyle = "#6d5dfc";

  ctx.fillText(text,400,650);
}

function roundRect(ctx,x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);

  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);

  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);

  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);

  ctx.closePath();
}

document
.getElementById("imageInput")
.addEventListener("change",function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    uploadedImage = new Image();

    uploadedImage.onload = function(){

      drawSticker();

    };

    uploadedImage.src = event.target.result;

  };

  reader.readAsDataURL(file);

});

function createSticker(){

  drawSticker();

}

function downloadSticker(){

  const link = document.createElement("a");

  link.download = "stickerpro.png";

  link.href = canvas.toDataURL("image/png");

  link.click();

}

drawSticker();

</script>

</body>
</html>
